[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magebin"
version = "0.1.2"
description = "MAGE-Bin: masked adaptive graph-evidence binning for viral metagenomes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["bioinformatics", "metagenomics", "viral binning", "graph neural network"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "igraph>=0.11",
  "leidenalg>=0.10",
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.1",
  "torch-geometric>=2.6",
]

[project.optional-dependencies]
test = [
  "build>=1.2",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.14",
  "twine>=5",
]

[project.scripts]
magebin = "magebin.cli:main"

[project.urls]
Repository = "https://github.com/RanaweeraHK/MAGE-Bin"
Issues = "https://github.com/RanaweeraHK/MAGE-Bin/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint.isort]
known-first-party = ["magebin"]

[tool.ruff.lint.per-file-ignores]
"src/magebin/[0-9]*_*.py" = ["N999"]
"src/magebin/preprocessing/[1-4]_*.py" = ["N999"]

[tool.coverage.run]
branch = true
source = ["magebin"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
